<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyPrint Admin - Gestion Catalogue{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'catalog:papertype_list' %}">
            <i class="bi bi-printer me-2"></i>MyPrint Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCatalog">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navCatalog">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if 'papers' in request.path %}active{% endif %}" href="{% url 'catalog:papertype_list' %}">
                        <i class="bi bi-file-earmark-text me-1"></i>Types de Papier
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'weights' in request.path %}active{% endif %}" href="{% url 'catalog:paperweight_list' %}">
                        <i class="bi bi-speedometer2 me-1"></i>Grammages & Coûts
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'bindings' in request.path %}active{% endif %}" href="{% url 'catalog:bindingtype_list' %}">
                        <i class="bi bi-journal-bookmark me-1"></i>Reliures
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <!-- Messages flash Django -->
    {% if messages %}
        <div class="row">
            <div class="col-12">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
