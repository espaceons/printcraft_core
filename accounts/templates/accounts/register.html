{% extends 'base.html' %}
{% block title %}Créer un compte | Myprint{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
            <h3 class="fw-bold text-center mb-1">Inscription</h3>
            <p class="text-center text-muted small mb-4">Créez votre compte pour commander et gérer vos fichiers d'impression</p>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-brand w-100 py-2 mt-3">Valider l'inscription</button>
            </form>
            
            <div class="text-center mt-4 small text-muted">
                Déjà inscrit ? <a href="{% url 'accounts:login' %}" class="text-primary text-decoration-none fw-semibold">Connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
