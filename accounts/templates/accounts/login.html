{% extends 'base.html' %}
{% block title %}Connexion | Myprint{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
            <h3 class="fw-bold text-center mb-1">Connexion</h3>
            <p class="text-center text-muted small mb-4">Accédez à votre espace Myprint et suivez vos tirages</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Identifiant</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2">Se connecter</button>
            </form>
            
            <div class="text-center mt-4 small text-muted">
                Pas encore de compte ? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-semibold">Créer un compte</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
